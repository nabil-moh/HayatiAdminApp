name: Build Hayati Admin APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets

      - name: Prepare Admin App
        run: |
          rm -rf www
          mkdir -p www

          cp admin.html www/admin.html
          cp admin.css www/admin.css
          cp admin.js www/admin.js
          cp config.js www/config.js

          cp manager-calligraphy.png www/manager-calligraphy.png
          cp hayati-app-icon.png www/hayati-app-icon.png

          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>حياتي - لوحة المدير</title>
            <script>
              location.replace("admin.html");
            </script>
          </head>
          <body>
            جاري فتح لوحة المدير...
          </body>
          </html>
          EOF

      - name: Verify files
        run: |
          test -f www/admin.html
          test -f www/admin.css
          test -f www/admin.js
          test -f www/config.js
          test -f www/manager-calligraphy.png
          test -f www/hayati-app-icon.png

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android

      - name: Generate Android Icons
        run: |
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Verify assets
        run: |
          test -n "$(find android -type f -name 'manager-calligraphy.png' -print -quit)"
          test -n "$(find android/app/src/main/res -type f -name 'ic_launcher.png' -print -quit)"

      - name: Force Gradle to Java 21
        working-directory: android
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
          ./gradlew -version

      - name: Build Admin APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Hayati-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
