name: Build Hayati APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp style.css www/
          cp app.js www/
          cp config.js www/
          cp admin.html www/
          cp admin.css www/
          cp admin.js www/

      - name: Verify Capacitor config
        run: |
          echo "===== capacitor.config.json ====="
          cat capacitor.config.json
          echo "===== www files ====="
          ls -la www

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java version
        run: java -version

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hayati-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
