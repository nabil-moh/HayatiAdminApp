<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قويتا زعوفتي المديرة | حياتي</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="loginView" class="view"><div class="login-card"><div class="brand">حياتي Hayati</div><h1>قويتا زعوفتي المديرة</h1><p>تسجيل الدخول إلى لوحة الإدارة</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة السر<div class="pass"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="togglePass" aria-label="إظهار كلمة السر">👁️</button></div></label><button class="primary" type="submit">دخول</button><p id="loginMsg" class="msg"></p></form></div></div>
<div id="adminView" class="view hidden"><header><div><div class="brand">حياتي Hayati</div><h1>قويتا زعوفتي المديرة</h1></div><button id="logout" class="ghost">تسجيل الخروج</button></header><main><div class="tabs"><button class="tab active" data-tab="orders">الطلبات</button><button class="tab" data-tab="products">المنتجات</button></div>
<section id="orders" class="panel"><div class="panel-head"><h2>الطلبات</h2><button id="refreshOrders" class="ghost">تحديث</button></div><div id="ordersMsg" class="msg"></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>العميل</th><th>الهاتف</th><th>الولاية</th><th>البلدية</th><th>العنوان</th><th>المجموع</th><th>المنتجات</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section>
<section id="products" class="panel hidden"><div class="panel-head"><h2>المنتجات</h2><button id="newProduct" class="primary">إضافة منتج</button></div><div id="productsMsg" class="msg"></div><div id="productGrid" class="grid"></div></section></main></div>
<div id="productModal" class="modal hidden"><div class="modal-card"><button id="closeProduct" class="close">×</button><h2 id="productTitle">إضافة منتج</h2><form id="productForm"><input type="hidden" id="productId"><label>اسم المنتج<input id="pName" required></label><label>القسم<select id="pCategory" required><option value="">اختاري القسم</option><option>ملابس</option><option>عطور</option><option>مواد التجميل</option><option>أحذية</option></select></label><label>السعر بالدج<input id="pPrice" type="number" min="0" required></label><label>رابط الصورة<input id="pImage" type="url" placeholder="https://..."></label><div class="actions"><button type="button" id="cancelProduct" class="ghost">إلغاء</button><button class="primary" type="submit">حفظ</button></div><p id="productFormMsg" class="msg"></p></form></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
