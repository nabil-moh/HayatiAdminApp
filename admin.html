<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>حياتي | لوحة الإدارة</title>
  <link rel="stylesheet" href="admin.css">

  <style>
    .manager-calligraphy {
      width: min(100%, 520px);
      max-height: 260px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>

<body>

<div id="loginScreen" class="screen">
  <div class="login-card">
    <h1>حياتي Hayati</h1>

    <h2>
      <img
        class="manager-calligraphy"
        src="manager-calligraphy.png"
        alt="اسم المديرة"
      >
    </h2>

    <input id="email" type="email" placeholder="البريد الإلكتروني">

    <div class="password-wrap">
      <input id="password" type="password" placeholder="كلمة المرور">
      <button id="passwordToggle" type="button" aria-label="إظهار كلمة المرور">👁️</button>
    </div>

    <button id="loginBtn" class="primary">دخول</button>
    <p id="loginMsg"></p>
  </div>
</div>

<div id="app" class="hidden">

  <header class="topbar">
    <button id="menuBtn" class="icon-btn">☰</button>
    <div class="brand">حياتي Hayati</div>
    <div class="notification" id="notificationBtn">
      🔔 <span id="notificationCount">0</span>
    </div>
  </header>

  <aside id="sideMenu" class="side-menu">
    <button data-section="home">🏠 الرئيسية</button>
    <button data-section="orders">📦 الطلبات</button>
    <button data-section="products">🛍️ منتجاتي</button>
    <button data-section="settings">⚙️ الإعدادات</button>
    <button id="logoutBtn">🚪 خروج</button>
  </aside>

  <main class="content">

    <section id="home" class="section active">

      <div class="manager-header">
        <img
          class="manager-calligraphy"
          src="manager-calligraphy.png"
          alt="اسم المديرة"
        >
      </div>

      <h2>الرئيسية</h2>

      <div class="stats">
        <div class="stat">
          <b id="ordersStat">0</b>
          <span>الطلبات</span>
        </div>

        <div class="stat">
          <b id="productsStat">0</b>
          <span>المنتجات</span>
        </div>
      </div>

      <button id="homeRefresh" class="secondary">🔄 تحديث</button>
    </section>

    <section id="orders" class="section">

      <div class="section-head">
        <h2>📦 الطلبات</h2>
        <button id="ordersRefresh" class="secondary">🔄 تحديث</button>
      </div>

      <div id="ordersList"></div>

    </section>

    <section id="products" class="section">

      <div class="section-head">

        <div>
          <h2>🛍️ منتجاتي</h2>

          <p class="muted">
            هذه القائمة تُقرأ مباشرة من جدول المنتجات في Supabase،
            أي أنها تمثل المنتجات الموجودة فعليًا في المتجر.
          </p>
        </div>

        <button id="productsRefresh" class="secondary">🔄 تحديث</button>

      </div>

      <div id="productsList"></div>

    </section>

    <section id="settings" class="section">

      <h2>⚙️ الإعدادات</h2>

      <div class="settings-card">

        <label>شعار المتجر</label>

        <input id="logoFile" type="file" accept="image/*">

        <img
          id="logoPreview"
          class="logo-preview"
          alt="شعار المتجر"
        >

        <button id="saveLogo" class="primary">
          حفظ الشعار
        </button>

        <label>لون تطبيق المدير</label>

        <input
          id="adminColor"
          type="color"
          value="#7c3aed"
        >

        <label>لون المتجر</label>

        <input
          id="storeColor"
          type="color"
          value="#7c3aed"
        >

        <button id="saveColors" class="primary">
          حفظ الألوان
        </button>

        <p id="settingsMsg"></p>

      </div>

    </section>

  </main>

</div>

<div id="orderModal" class="modal hidden">

  <div class="modal-box">

    <button id="closeOrderModal" class="close">×</button>

    <h2>تفاصيل الطلب</h2>

    <div id="orderDetails"></div>

    <button id="deleteOrderBtn" class="danger">
      🗑️ حذف الطلب
    </button>

  </div>

</div>

<div id="productModal" class="modal hidden">

  <div class="modal-box">

    <button id="closeProductModal" class="close">×</button>

    <h2 id="productModalTitle">تعديل المنتج</h2>

    <input id="productId" type="hidden">

    <input id="productName" placeholder="اسم المنتج">

    <input id="productCategory" placeholder="الفئة">

    <input
      id="productPrice"
      type="number"
      placeholder="السعر الحالي"
    >

    <input
      id="productOldPrice"
      type="number"
      placeholder="السعر القديم"
    >

    <input
      id="productStock"
      type="number"
      placeholder="المخزون"
    >

    <input
      id="productImage"
      placeholder="رابط صورة المنتج"
    >

    <textarea
      id="productDescription"
      placeholder="الوصف"
    ></textarea>

    <button id="saveProduct" class="primary">
      حفظ
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>

</body>
</html>
